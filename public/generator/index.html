<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Screen Time">
    <title>Screen Time Generator — nima</title>
    <script>
      if (new URLSearchParams(location.search).get("theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.querySelector('meta[name="theme-color"]').content = "#f2f2f7";
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = "default";
      }
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./generator.css?v=12">
  </head>
  <body>
    <main class="screen" aria-label="Screen Time replica">
      <header class="status-bar" aria-hidden="true">
        <time id="status-time">8:08</time>
        <div class="status-icons">
          <span class="signal"><i></i><i></i><i></i><i></i></span>
          <svg class="wifi" viewBox="0 0 26 20"><path d="M2 7.3a17.2 17.2 0 0 1 22 0M6 11.4a11.2 11.2 0 0 1 14 0M10.2 15.5a4.5 4.5 0 0 1 5.6 0"/><circle cx="13" cy="18" r="1.4"/></svg>
          <span class="battery"><i></i></span>
        </div>
      </header>

      <nav class="nav-bar" aria-label="Screen Time navigation">
        <button class="round-button" id="back-button" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="m15.5 4-8 8 8 8"/></svg>
        </button>
        <button class="device-title" id="edit-trigger" type="button" aria-label="Edit generator settings">
          <span id="device-name">Yamin’s iPhone</span><span class="tiny-icons">↕︎</span>
        </button>
        <button class="devices-button" id="devices-button" type="button">Devices</button>
      </nav>

      <div class="segment" role="tablist" aria-label="Time period">
        <button role="tab" id="week-tab" aria-selected="false">Week</button>
        <button class="selected" role="tab" id="day-tab" aria-selected="true">Day</button>
      </div>

      <section class="content">
        <h1 id="screen-title">Screen Time</h1>
        <article class="summary-card">
          <div class="summary-heading">
            <p id="date-label">Today, 13 September</p>
            <strong id="total-label">7h 5m</strong>
          </div>

          <div class="week-chart" aria-label="Screen time by day">
            <div class="week-plot">
              <div class="horizontal-grid grid-top"></div>
              <div class="horizontal-grid grid-mid"></div>
              <div class="horizontal-grid grid-bottom"></div>
              <div class="average-line" id="average-line"><span></span></div>
              <div class="week-bars" id="week-bars"></div>
              <div class="week-axis"><span id="week-axis-top">8h</span><span id="week-axis-mid">4h</span><span>0</span></div>
              <span class="avg-label">avg</span>
            </div>
          </div>

          <div class="hour-chart" aria-label="Screen time by hour">
            <div class="hour-plot">
              <div class="hour-grid"><i></i><i></i><i></i><i></i><i></i></div>
              <div class="hour-vertical-grid" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
              <div class="hour-bars" id="hour-bars"></div>
              <div class="hour-axis-y"><span>60m</span><span>30m</span><span>0</span></div>
            </div>
            <div class="hour-axis-x"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span></div>
          </div>

          <div class="categories" id="categories"></div>
        </article>

        <p class="updated" id="updated-label">Updated today at 8:08pm</p>

        <section class="used-section">
          <div class="section-heading"><h2>Most Used</h2><button id="category-toggle">Show Categories</button></div>
          <div class="ios-list app-list" id="app-list"></div>
        </section>

        <button class="customize-button" id="customize-button" type="button">Customize this result</button>
        <p class="nima-mark">Generated with nima</p>
      </section>
    </main>

    <div class="sheet-wrap" id="editor" aria-hidden="true">
      <button class="sheet-backdrop" id="sheet-backdrop" aria-label="Close editor"></button>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <div class="sheet-handle"></div>
        <div class="sheet-title-row">
          <button id="cancel-editor" type="button">Cancel</button>
          <h2 id="editor-title">Generate Screen Time</h2>
          <button id="apply-editor" type="button">Done</button>
        </div>
        <form id="generator-form">
          <label>Device name<input id="name-input" maxlength="24" value="Ella’s iPhone"></label>
          <div class="time-fields">
            <label>Hours<input id="hours-input" type="number" min="0" max="23" value="7" inputmode="numeric"></label>
            <label>Minutes<input id="minutes-input" type="number" min="0" max="59" value="5" inputmode="numeric"></label>
          </div>
          <button class="randomize-time-button" id="randomize-time" type="button">Randomise time</button>
          <label>Usage style
            <select id="profile-input">
              <option value="social">Social heavy</option>
              <option value="balanced">Balanced</option>
              <option value="night">Night owl</option>
              <option value="productive">Productive</option>
            </select>
          </label>
          <label class="theme-field" for="theme-input">
            <span>Light mode</span>
            <input id="theme-input" type="checkbox" role="switch">
          </label>
          <label>Date<input id="date-input" type="date"></label>
          <button class="generate-button" type="submit">Generate</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status"></div>
    <script src="./generator.js?v=12"></script>
  </body>
</html>
